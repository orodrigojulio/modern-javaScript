<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Projeto Lista de Comparas</title>
</head>
<body>
    <div class="container">
        <header>
            <img src="" alt="">
            <h1>Lista de Compras</h1>   
        </header>
        <form action="" id="item-form">
            <div class="form-control">
                <input type="text" class="form-input" id="item-input" name="item" placeholder="Adicionar item...">
            </div>
            <div class="form-control">
                <button class="btn" type="submit">
                    <i class="fa-solid fa-plus"></i>Adicionar item
                </button>
            </div>
        </form>

        <div class="filter">
            <input type="text" class="form-input-filter" id="filter" name="filter" placeholder="Filtrar itens...">
        </div>
        <ul id="item-list" class="items">
            <li>
                Maçãs
                <button class="remove-item btn-link text-red" >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </li>
            <li>
                Biscoitos
                <button class="remove-item btn-link text-red" >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </li>
        </ul>
        <button class="btn-clear" id="clear">limpar tudo</button>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
